{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="card form-card">
  <h1>Login</h1>
  <p class="muted" style="margin-bottom:16px">Sign in with your Student ID.</p>
  <form method="post">
    {% csrf_token %}
    {% include 'partials/form_fields.html' %}
    <button class="btn" type="submit">Login</button>
    <a class="btn btn-outline" href="{% url 'accounts:register' %}">Create account</a>
  </form>
</div>
{% endblock %}
